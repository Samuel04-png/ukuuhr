  <style>
    .app-loading {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #FCFBFF;
      color: #25163F;
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .app-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
    }
    .loader-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .loader-mark {
      position: relative;
      width: 140px;
      height: 140px;
      display: grid;
      place-items: center;
    }
    .loader-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      filter: grayscale(1) contrast(1.15);
      animation: logoFloat 2.6s ease-in-out infinite;
    }
    .loader-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid #7C3AED;
      opacity: 0.18;
    }
    .loader-ring.outer {
      inset: 0;
      border-top-color: transparent;
      border-right-color: transparent;
      animation: ringSpin 6s linear infinite;
    }
    .loader-ring.inner {
      inset: 22px;
      border-bottom-color: transparent;
      border-left-color: transparent;
      animation: ringSpinReverse 3.6s linear infinite;
    }
    .loader-caption {
      font-size: 13px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #4A3C68;
    }
    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0) scale(1);
        opacity: 0.92;
      }
      50% {
        transform: translateY(-6px) scale(1.03);
        opacity: 1;
      }
    }
    @keyframes ringSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ringSpinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .loader-logo,
      .loader-ring {
        animation: none;
      }
    }
  </style>

  <script src="flutter.js" defer></script>

<body>
  <!-- PWA install prompt placeholder -->
  <div id="app-loading" class="app-loading">
    <div class="loader-shell">
      <div class="loader-mark">
        <span class="loader-ring outer"></span>
        <span class="loader-ring inner"></span>
        <img class="loader-logo" src="assets/assets/images/Ukuu.png" alt="UKUU HR logo">
      </div>
      <div class="loader-caption">Loading</div>
    </div>
  </div>
  <script>
    (function() {
      var appBooted = false;

      function removeLoader() {
        var loader = document.getElementById('app-loading');
        if (!loader) return;
        loader.classList.add('is-hidden');
        setTimeout(function() {
          loader.remove();
        }, 400);
      }

      function markBooted() {
        if (appBooted) return;
        appBooted = true;
        removeLoader();
      }

      window.addEventListener('flutter-first-frame', markBooted);

      setTimeout(function() {
        if (!appBooted) {
          console.warn('Flutter did not report first frame. Hiding loader.');
          markBooted();
        }
      }, 12000);
    })();
  </script>
</body>
